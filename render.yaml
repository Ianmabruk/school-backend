# School Project Backend — native Node.js deployment (NOT Docker).
services:
  - type: web
    name: school-backend-aur5
    runtime: node
    rootDir: .
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    scaling:
      minInstances: 1
      maxInstances: 3
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
